name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-fmt-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  container-build-and-cargo-test:
    needs: cargo-fmt-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: |
            type=gha,scope=test
            type=gha,scope=app
          cache-to: type=gha,scope=test,mode=max

  publish-image:
    if: github.event_name == 'push'
    needs: container-build-and-cargo-test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml
