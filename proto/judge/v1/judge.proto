syntax = "proto3";

package jot.judge.v1;

// One request produces zero or more progress events followed by one result event.
// Invalid requests may instead fail with a gRPC status before grading starts.
service JudgeService {
  rpc Grade(GradeRequest) returns (stream GradeEvent);
}

message GradeRequest {
  // Set by the backend to correlate the request, stream, and logs.
  string request_id = 1;
  Language language = 2;
  string source_code = 3;
  string case_set_id = 4;
  // An immutable case-set version. Also forms part of the cache key.
  string case_set_version = 5;
  ResourceLimits limits = 6;
}

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_CPP = 1;
  LANGUAGE_RUST = 2;
  LANGUAGE_GO = 3;
}

message ResourceLimits {
  // Zero means the server-configured default. The server enforces upper bounds.
  uint64 compile_time_ms = 1;
  uint64 case_time_ms = 2;
  uint64 memory_bytes = 3;
  uint64 output_bytes = 4;
}

message GradeEvent {
  string request_id = 1;

  oneof payload {
    GradeProgress progress = 2;
    GradeResult result = 3;
  }
}

message GradeProgress {
  GradePhase phase = 1;
  uint32 completed_cases = 2;
  uint32 total_cases = 3;
  // Short, non-sensitive description of the current operation.
  string message = 4;
}

enum GradePhase {
  GRADE_PHASE_UNSPECIFIED = 0;
  GRADE_PHASE_RECEIVED = 1;
  GRADE_PHASE_COMPILING = 2;
  GRADE_PHASE_FETCHING_CASES = 3;
  GRADE_PHASE_RUNNING = 4;
  GRADE_PHASE_VALIDATING = 5;
}

message GradeResult {
  Verdict verdict = 1;
  repeated CaseResult cases = 2;
  // Populated for a compilation failure; capped by the server.
  string compiler_diagnostics = 3;
  // Short explanation for a grading system failure, without secrets.
  string error_message = 4;
}

message CaseResult {
  string case_id = 1;
  Verdict verdict = 2;
  uint64 elapsed_ms = 3;
  uint64 peak_memory_bytes = 4;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ACCEPTED = 1;
  VERDICT_WRONG_ANSWER = 2;
  VERDICT_COMPILATION_ERROR = 3;
  VERDICT_RUNTIME_ERROR = 4;
  VERDICT_TIME_LIMIT_EXCEEDED = 5;
  VERDICT_MEMORY_LIMIT_EXCEEDED = 6;
  VERDICT_OUTPUT_LIMIT_EXCEEDED = 7;
  VERDICT_SYSTEM_ERROR = 8;
}
